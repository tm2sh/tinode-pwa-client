<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#e9eff7" media="(prefers-color-scheme: light)" data-theme-color="light" />
    <meta name="theme-color" content="#101c2c" media="(prefers-color-scheme: dark)" data-theme-color="dark" />
    <meta name="theme-color" content="#1c1c1c" media="not all" data-theme-color="black" />
    <meta name="theme-color" content="#ffffff" media="not all" data-theme-color="white" />
    <script>%BOOTSTRAP_THEME%</script>
    <script>%BOOTSTRAP_LANGUAGE%</script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tinode PWA Client" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/apple-touch-icon.png" />
    <style id="bootstrap-styles">%BOOTSTRAP_STYLES%</style>
    <title>Tinode PWA Client</title>
  </head>
  <body>
    <div id="root">
      <div id="bootstrap-screen" class="app-loading" role="status" aria-label="%BOOTSTRAP_LOADING_LABEL%" aria-busy="true">
        <div class="app-loading-indicator">
          <svg class="auth-spinner" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            %BOOTSTRAP_SPINNER%
          </svg>
        </div>
      </div>
    </div>
    <script>%BOOTSTRAP_LOADING_LANGUAGE%</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
